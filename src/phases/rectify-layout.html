<!-- The built-in content of the rectify screen's areas, one template for each.
     Pass a copy of a template, changed, as phases.rectify.layout.<area>. -->
<template data-mds-area="header">
	<button type="button" data-mds-button="retake">
		<span class="mds-rectify-label"></span>
	</button>
	<button type="button" data-mds-button="cancel">
		<span class="mds-rectify-label"></span>
	</button>
	<span class="mds-rectify-title"></span>
	<button type="button" data-mds-button="apply">
		<span class="mds-rectify-label"></span>
	</button>
</template>
<template data-mds-area="footer">
	<button type="button" data-mds-button="undo">
		<span class="mds-icon" data-mds-icon="undo"></span>
		<span class="mds-rectify-label"></span>
	</button>
	<span class="mds-rectify-divider"></span>
	<button type="button" data-mds-button="detectBoundary">
		<span class="mds-icon" data-mds-icon="detect-boundary"></span>
		<span class="mds-rectify-label"></span>
	</button>
	<button type="button" data-mds-button="fullImage">
		<span class="mds-icon" data-mds-icon="full-image"></span>
		<span class="mds-rectify-label"></span>
	</button>
</template>
