<!-- The built-in content of the edit screen's areas, one template for each.
     Pass a copy of a template, changed, as phases.edit.layout.<area>. -->
<template data-mds-area="header">
	<button type="button" data-mds-button="cancel">
		<span class="mds-icon" data-mds-icon="cancel"></span>
	</button>
	<span class="mds-edit-divider"></span>
	<button type="button" data-mds-button="addPage">
		<span class="mds-icon" data-mds-icon="add-page"></span>
		<span class="mds-edit-label"></span>
	</button>
	<button type="button" data-mds-button="done">
		<span class="mds-edit-label"></span>
	</button>
</template>
<template data-mds-area="footer">
	<button type="button" data-mds-button="delete">
		<span class="mds-icon" data-mds-icon="delete"></span>
		<span class="mds-edit-label"></span>
	</button>
	<button type="button" data-mds-button="undo">
		<span class="mds-icon" data-mds-icon="undo"></span>
		<span class="mds-edit-label"></span>
	</button>
	<button type="button" data-mds-button="redo">
		<span class="mds-icon" data-mds-icon="redo"></span>
		<span class="mds-edit-label"></span>
	</button>
	<span class="mds-edit-divider"></span>
	<button type="button" data-mds-button="rectify">
		<span class="mds-icon" data-mds-icon="adjust"></span>
		<span class="mds-edit-label"></span>
	</button>
	<button type="button" data-mds-button="rotate">
		<span class="mds-icon" data-mds-icon="rotate"></span>
		<span class="mds-edit-label"></span>
	</button>
	<button type="button" data-mds-button="filter">
		<span class="mds-icon" data-mds-icon="filter"></span>
		<span class="mds-edit-label"></span>
	</button>
</template>
