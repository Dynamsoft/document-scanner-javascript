<div class="mds-edit">
	<div class="mds-edit-header" data-mds-area="header"></div>
	<div class="mds-edit-mode-header" hidden>
		<button type="button" data-mds-button="cancel">
			<span class="mds-edit-label"></span>
		</button>
		<span class="mds-edit-title"></span>
		<button type="button" data-mds-button="apply">
			<span class="mds-edit-label"></span>
		</button>
	</div>
	<div class="mds-edit-stage">
		<div class="mds-edit-viewer"></div>
		<div class="mds-edit-float-bar">
			<button type="button" data-mds-button="thumbnails" aria-pressed="false">
				<span class="mds-icon" data-mds-icon="thumbnails"></span>
			</button>
			<div class="mds-edit-pagination">
				<button type="button" data-mds-button="previousPage">
					<span class="mds-icon" data-mds-icon="previous-page"></span>
				</button>
				<span class="mds-edit-page-number"></span>
				<button type="button" data-mds-button="nextPage">
					<span class="mds-icon" data-mds-icon="next-page"></span>
				</button>
			</div>
		</div>
	</div>
	<div class="mds-edit-footer" data-mds-area="footer"></div>
	<div class="mds-edit-filters" role="group" hidden></div>
</div>
